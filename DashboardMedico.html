<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel de gestión diaria para profesionales de la salud.">
  <title>TurnoSalud</title>
  
  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Favicons y PWA -->
  <link rel="icon" type="image/png" sizes="32x32" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d47a1">

  <!-- Hojas de Estilos -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/DashboardMedico.css">
</head>
<body class="page-layout">

  <!-- Cabecera Principal / Navegación -->
  <header class="main-header navbar">
    <h1 class="header-title">Panel de Control Profesional</h1>
    <div class="user-info">
      <span id="lblMedicoNombre">Cargando Médico...</span>
      <button type="button" class="btn-logout" id="btnLogout">Cerrar Sesión</button>
    </div>
  </header>

  <main class="main-content">
    <!-- Barra de Herramientas / Filtros -->
    <section class="toolbar-card">
      <div class="filter-group">
        <label for="fechaAgenda">Agenda del Día:</label>
        <input type="date" id="fechaAgenda" name="fechaAgenda">
      </div>
      <div class="action-group">
        <button type="button" class="btn-secondary" id="btnBloquearHorario">+ Bloquear Horario Puntual</button>
      </div>
    </section>

    <!-- Lista de Turnos Agendados -->
    <section class="agenda-card">
      <h2>Turnos Programados</h2>
      <div class="table-container">
        <table class="tabla-turnos">
          <thead>
            <tr>
              <th>Hora</th>
              <th>Paciente / Cobertura</th>
              <th>Teléfono</th>
              <th>Estado</th>
              <th>Acciones Rápidas</th>
            </tr>
          </thead>
          <tbody id="contenedorTurnos">
            <tr>
              <td colspan="5" class="texto-cargando">Cargando agenda...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal de Bloqueo Manual de Horarios Puntuales -->
  <div id="modalBloqueo" class="modal-overlay" style="display: none;" role="dialog" aria-labelledby="tituloModalBloqueo" aria-modal="true">
    <div class="modal-card">
      <h3 id="tituloModalBloqueo">Bloquear Horario Específico</h3>
      <p class="modal-descripcion">Inactiva una hora o bloque específico de tu agenda diaria por imprevistos o trámites.</p>
      
      <form id="formBloqueoHorario" autocomplete="off">
        <div class="form-group">
          <label for="bloqueoFecha">Fecha <span style="color: red;">*</span></label>
          <input type="date" id="bloqueoFecha" name="bloqueoFecha" required>
        </div>

        <div class="form-group">
          <label for="bloqueoHora">Horario a Bloquear <span style="color: red;">*</span></label>
          <select id="bloqueoHora" name="bloqueoHora" required>
            <option value="" disabled selected>Seleccione la fecha primero...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="bloqueoMotivo">Motivo (Opcional)</label>
          <input type="text" id="bloqueoMotivo" name="bloqueoMotivo" placeholder="Ej: Trámite personal, reunión institucional">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancelar" id="btnCerrarModalBloqueo">Cancelar</button>
          <button type="submit" class="btn-confirmar-bloqueo">Confirmar Bloqueo</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/DashboardMedico.js"></script>
  <script src="js/pwa-init.js"></script>
</body>
</html>

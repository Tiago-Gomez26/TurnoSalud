<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestión e itinerario de turnos agendados para profesionales médicos.">
  <title>Planilla de Turnos | TurnoSalud</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/ListaDeTurnos.css">
</head>
<body>

  <header>
    🏥 TurnoSalud — Agenda Médica Operativa
  </header>

  <main>
    <div class="contenedor-panel-turnos">
      <div class="header-panel">
        <h2>Itinerario de Pacientes Agendados</h2>
        <a href="ListaDeAdministracion.html" style="font-weight: 600; color: var(--primary-600); text-decoration: none;">⚙️ Panel General</a>
      </div>

      <div class="tabla-turnos-container">
        <table class="tabla-turnos">
          <thead>
            <tr>
              <th>Fecha y Hora</th>
              <th>Paciente</th>
              <th>Contacto</th>
              <th>Médico Asignado</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="cuerpoTablaTurnos">
            <tr>
              <td colspan="5" style="text-align: center; color: #64748b;">Cargando registro de la agenda...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 TurnoSalud Inc. Panel Exclusivo para Personal Registrado.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/ListaDeTurnos.js"></script>
</body>
</html>

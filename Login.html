<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acceso seguro al portal corporativo y administrativo de TurnoSalud.">
  <title>TurnoSalud</title>
  
  <!-- Iconos para navegador, iOS y PWA -->
  <link rel="icon" type="image/png" sizes="32x32" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d47a1">

  <!-- Precarga de fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Estilos CSS -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/Login.css">
</head>
<body>

  <main>
    <div class="card-login">
      <h2>Acceso Profesional</h2>
      <p class="subtitle">Ingrese credenciales institucionales de personal de salud.</p>

      <form id="formLogin" class="form-login">
        <div class="form-group">
          <label for="email">Correo Electrónico *</label>
          <input type="email" id="email" name="email" placeholder="medico@turnosalud.com" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña *</label>
          <input type="password" id="password" name="password" placeholder="••••••••••••" required>
        </div>

        <button type="submit" class="btn-login">Iniciar Sesión Segura</button>
      </form>
    </div>
  </main>

  <footer>
    &copy; 2026 TurnoSalud Inc. Acceso Protegido por SSL/TLS.
  </footer>

  <!-- Scripts JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/Login.js"></script>
  <script src="js/pwa-init.js"></script>

</body>
</html>
